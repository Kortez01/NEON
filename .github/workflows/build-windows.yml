name: Export Windows x64

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export Windows x64
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $command = Get-Command godot -ErrorAction Stop
          $godotPath = $command.Source

          Write-Host "Godot executable: $godotPath"

          Add-Content -Path $env:GITHUB_ENV `
            -Value "GODOT_EXE=$godotPath"

          godot --headless --version

          $code = $LASTEXITCODE

          if (($null -ne $code) -and ($code -ne 0)) {
            throw "Godot returned exit code $code"
          }

      - name: Check project files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $requiredFiles = @(
            "project.godot",
            "export_presets.cfg"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Missing required file: $file"
            }
          }

          Write-Host "Project files found."

      - name: Validate project
        shell: pwsh
        run: |
          $project = $env:GITHUB_WORKSPACE

          & "$env:GODOT_EXE" `
            --headless `
            --editor `
            --path "$project" `
            --quit

          $code = $LASTEXITCODE

          if (($null -ne $code) -and ($code -ne 0)) {
            throw "Godot project validation failed: $code"
          }

      - name: Export Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = $env:GITHUB_WORKSPACE
          $config = Get-Content "export_presets.cfg" -Raw

          $blocks = [regex]::Matches(
            $config,
            '(?ms)^\[preset\.\d+\]\r?\n.*?(?=^\[|\z)'
          )

          $presetName = $null

          foreach ($item in $blocks) {
            $block = $item.Value

            if ($block -match '(?m)^platform="Windows Desktop"\s*$') {
              $match = [regex]::Match(
                $block,
                '(?m)^name="([^"]+)"\s*$'
              )

              if ($match.Success) {
                $presetName = $match.Groups[1].Value
                break
              }
            }
          }

          if (!$presetName) {
            throw "Windows Desktop preset not found in export_presets.cfg"
          }

          Write-Host "Export preset: $presetName"

          $buildDir = Join-Path $project "build"

          New-Item -ItemType Directory `
            -Path $buildDir -Force | Out-Null

          $exePath = Join-Path $buildDir "NEON_REVENANT.exe"

          & "$env:GODOT_EXE" `
            --headless `
            --path "$project" `
            --export-release "$presetName" "$exePath"

          $code = $LASTEXITCODE

          if (($null -ne $code) -and ($code -ne 0)) {
            throw "Export failed with exit code $code"
          }

          if (!(Test-Path $exePath)) {
            throw "EXE was not generated. Check the Godot export log."
          }

          Write-Host "EXE created successfully:"
          Get-ChildItem $buildDir

      - name: Upload compiled game
        uses: actions/upload-artifact@v4
        with:
          name: NEON-REVENANT-Windows-x64
          path: build/*
          if-no-files-found: error
          retention-days: 30
