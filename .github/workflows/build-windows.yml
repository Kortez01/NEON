name: Export Windows x64

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Build Windows Game
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Godot installation..."
          command -v godot
          godot --headless --version

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          test -f project.godot || {
            echo "::error::project.godot is missing from repository root"
            exit 1
          }

          test -f export_presets.cfg || {
            echo "::error::export_presets.cfg is missing from repository root"
            exit 1
          }

          grep -q '^platform="Windows Desktop"$' export_presets.cfg || {
            echo "::error::Windows Desktop preset not found"
            exit 1
          }

          mkdir -p build

          echo "Project files found."

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --quit 2>&1 | tee build/validate.log

      - name: Export Windows EXE
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/build/NEON_REVENANT.exe"
          LOG="$GITHUB_WORKSPACE/build/export.log"

          echo "Exporting Windows Desktop build..."

          godot --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-release "Windows Desktop" "$OUTPUT" \
            2>&1 | tee "$LOG"

          if [ ! -f "$OUTPUT" ]; then
            echo "::error::Windows EXE was not generated"
            cat "$LOG"
            exit 1
          fi

          echo "EXE generated successfully:"
          ls -lh "$GITHUB_WORKSPACE/build/"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEON-REVENANT-Build-Logs
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload compiled Windows game
        uses: actions/upload-artifact@v4
        with:
          name: NEON-REVENANT-Windows-x64
          path: build/*
          if-no-files-found: error
          retention-days: 30
