name: Build Windows EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    name: Export Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        shell: pwsh
        run: |
          godot --version
          if ($LASTEXITCODE -ne 0) {
            throw "Godot не запустился"
          }

      - name: Validate project
        shell: pwsh
        run: |
          if (!(Test-Path "project.godot")) {
            throw "Файл project.godot отсутствует в корне репозитория"
          }

          godot --headless --editor `
            --path "$env:GITHUB_WORKSPACE" --quit

          if ($LASTEXITCODE -ne 0) {
            throw "Ошибка проверки проекта Godot"
          }

      - name: Export Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "build" -Force |
            Out-Null

          godot --headless `
            --path "$env:GITHUB_WORKSPACE" `
            --export-release "Windows Desktop" `
            "$env:GITHUB_WORKSPACE\build\NEON_REVENANT.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "Ошибка экспорта EXE"
          }

          if (!(Test-Path "build\NEON_REVENANT.exe")) {
            throw "Файл EXE не создан"
          }

      - name: Upload compiled game
        uses: actions/upload-artifact@v4
        with:
          name: NEON-REVENANT-Windows-x64
          path: build/NEON_REVENANT.exe
          if-no-files-found: error
          retention-days: 30
