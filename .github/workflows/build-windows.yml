name: Export Windows x64

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download official Godot 4.6.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "4.6.3"
          $tag = "$version-stable"
          $base = "https://github.com/godotengine/godot/releases/download/$tag"
          $tools = Join-Path $env:RUNNER_TEMP "godot46"

          New-Item -ItemType Directory -Path $tools -Force |
            Out-Null

          # Download Godot console executable
          $engineZip = Join-Path $tools "engine.zip"
          $engineDir = Join-Path $tools "engine"
          $godotPath = Join-Path $tools "godot_console.exe"

          $engineUrl = "$base/Godot_v${version}-stable_win64_console.exe.zip"

          Invoke-WebRequest -Uri $engineUrl -OutFile $engineZip

          Expand-Archive -LiteralPath $engineZip `
            -DestinationPath $engineDir -Force

          # Find the correct executable
          $found = Get-ChildItem -Path $engineDir -Recurse -File |
            Where-Object {
              $_.Name -eq "Godot_v${version}-stable_win64_console.exe"
            } |
            Select-Object -First 1

          if (!$found) {
            Get-ChildItem -Path $engineDir -Recurse |
              Select-Object FullName
            throw "Godot console executable was not found"
          }

          Copy-Item -LiteralPath $found.FullName `
            -Destination $godotPath -Force

          # Verify that Godot starts
          & $godotPath --headless --version
          $engineExit = $LASTEXITCODE

          if ($engineExit -ne 0) {
            throw "Godot failed to start. Exit code: $engineExit"
          }

          Add-Content -Path $env:GITHUB_ENV `
            -Value "GODOT_EXE=$godotPath"

          # Download export templates
          $templatesZip = Join-Path $tools "templates.zip"
          $templatesDir = Join-Path $tools "templates-unpacked"

          $templatesUrl = "$base/Godot_v${version}-stable_export_templates.tpz"

          Invoke-WebRequest -Uri $templatesUrl `
            -OutFile $templatesZip

          Expand-Archive -LiteralPath $templatesZip `
            -DestinationPath $templatesDir -Force

          $templateSource = Join-Path $templatesDir "templates"

          if (!(Test-Path $templateSource)) {
            $templateSource = $templatesDir
          }

          $templateTarget = Join-Path $env:APPDATA `
            "Godot\export_templates\${version}.stable"

          New-Item -ItemType Directory `
            -Path $templateTarget -Force | Out-Null

          Copy-Item -Path "$templateSource\*" `
            -Destination $templateTarget -Recurse -Force

          $requiredTemplate = Join-Path $templateTarget `
            "windows_release_x86_64.exe"

          if (!(Test-Path $requiredTemplate)) {
            Get-ChildItem -Path $templateTarget -Recurse |
              Select-Object FullName
            throw "Windows release export template is missing"
          }

      - name: Validate project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "project.godot")) {
            throw "project.godot is missing from repository root"
          }

          if (!(Test-Path "export_presets.cfg")) {
            throw "export_presets.cfg is missing from repository root"
          }

          & "$env:GODOT_EXE" --headless --editor `
            --path "$env:GITHUB_WORKSPACE" --quit

          if ($LASTEXITCODE -ne 0) {
            throw "Godot could not load the project"
          }

      - name: Export Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = $env:GITHUB_WORKSPACE
          $presetFile = Join-Path $project "export_presets.cfg"
          $content = Get-Content -Path $presetFile -Raw

          $blocks = [regex]::Matches(
            $content,
            '(?ms)^\[preset\.\d+\]\r?\n.*?(?=^\[|\z)'
          )

          $presetName = $null

          foreach ($item in $blocks) {
            $block = $item.Value

            if ($block -match '(?m)^platform="Windows Desktop"\s*$') {
              $match = [regex]::Match(
                $block,
                '(?m)^name="([^"]+)"\s*$'
              )

              if ($match.Success) {
                $presetName = $match.Groups[1].Value
                break
              }
            }
          }

          if (!$presetName) {
            throw "Windows Desktop preset not found in export_presets.cfg"
          }

          Write-Host "Using export preset: $presetName"

          $buildDir = Join-Path $project "build"

          New-Item -ItemType Directory `
            -Path $buildDir -Force | Out-Null

          $exe = Join-Path $buildDir "NEON_REVENANT.exe"

          & "$env:GODOT_EXE" --headless `
            --path "$project" `
            --export-release "$presetName" "$exe"

          if ($LASTEXITCODE -ne 0) {
            throw "Windows EXE export failed"
          }

          if (!(Test-Path $exe)) {
            throw "NEON_REVENANT.exe was not generated"
          }

          Get-ChildItem -Path $buildDir

      - name: Upload compiled game
        uses: actions/upload-artifact@v4
        with:
          name: NEON-REVENANT-Windows-x64
          path: build/*
          if-no-files-found: error
          retention-days: 30
